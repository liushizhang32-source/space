name: Unified Acceptance
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install -r orchestrator/tests/requirements-unified-test.txt
          python -m pip check
      - name: Prepare versioned media environment
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed' }
          "FFMPEG_PATH=$((Get-Command ffmpeg).Source)" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$((Get-Command ffprobe).Source)" >> $env:GITHUB_ENV
          python scripts/prepare_ci_font.py --output "$env:RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          if ($LASTEXITCODE -ne 0) { throw 'Font verification failed' }
          "VIDEO_FONT=$env:RUNNER_TEMP/NotoSansCJKsc-Regular.otf" >> $env:GITHUB_ENV
          python -c "import pathlib,tempfile; d=pathlib.Path(tempfile.mkdtemp()); p=d/'target'; p.write_bytes(b'test'); (d/'link').symlink_to(p); assert (d/'link').is_symlink()"
          if ($LASTEXITCODE -ne 0) { throw 'CI must support real file symlink tests; no skip fallback' }
      - name: Verify native OpenCV, not a namespace fallback
        run: python -c "import cv2,numpy; assert callable(cv2.grabCut); print(cv2.__version__, numpy.__version__)"
      - name: Exact Head full offline acceptance
        run: python -B scripts/run_full_offline_acceptance.py --phase full --require-no-skips --output "${{ runner.temp }}/unified-results"
      - name: Stage raw evidence, including failures
        if: always()
        run: python scripts/stage_acceptance_artifacts.py --source "${{ runner.temp }}/unified-results" --output "${{ runner.temp }}/unified-upload"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-exact-head
          path: ${{ runner.temp }}/unified-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

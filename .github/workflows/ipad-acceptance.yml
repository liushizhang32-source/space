name: iPad WebKit Acceptance
on:
  push:
    branches: [feature/zszb-ipad-integration-001]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-engine:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared app and WebKit
        run: |
          python -m pip install -r requirements-real-model.txt
          python -m playwright install webkit
      - name: Trust ephemeral test household CA
        run: |
          CA=$(python scripts/prepare_ipad_ci_tls.py)
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CA"
      - name: Strict HTTPS and iPad portrait landscape full playback
        env:
          IPAD_EVIDENCE: ${{ runner.temp }}/ipad-results
        run: |
          mkdir -p "$IPAD_EVIDENCE"
          git rev-parse HEAD > "$IPAD_EVIDENCE/tested-commit.txt"
          python -m pytest tests/ipad -o addopts= -v --tb=short --basetemp "$RUNNER_TEMP/ipad-tmp" --junitxml "$IPAD_EVIDENCE/ipad.xml" > "$IPAD_EVIDENCE/pytest.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ipad-webkit-exact-head
          path: ${{ runner.temp }}/ipad-results/
          if-no-files-found: warn
